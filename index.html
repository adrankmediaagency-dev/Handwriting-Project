<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a4d8c">
<title>Freelancer Publication 📖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:'Inter',system-ui,-apple-system,sans-serif}
body{color:#0f2d4a;overflow-x:hidden;background:#0a1f33}
.page{
  min-height:100vh;width:100%;display:flex;justify-content:center;align-items:center;
  position:relative;overflow:hidden;padding:24px 16px;
  background:
    linear-gradient(160deg,rgba(6,28,55,0.15) 0%,rgba(10,40,75,0.12) 50%,rgba(8,35,65,0.18) 100%),
    url('https://images.pexels.com/photos/29233080/pexels-photo-29233080.jpeg?auto=compress&cs=tinysrgb&w=1920') center/cover no-repeat fixed,
    linear-gradient(160deg,#1a5f9e,#0a2a4a);
}
.page::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 25% 15%,rgba(70,150,220,0.06) 0%,transparent 50%);pointer-events:none;z-index:1}
.card{
  position:relative;z-index:2;width:min(100%,620px);padding:34px 30px 30px;
  display:flex;flex-direction:column;align-items:center;text-align:center;border-radius:26px;
  background:rgba(255,255,255,0.18);
  backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);
  border:1px solid rgba(255,255,255,0.32);
  box-shadow:0 25px 50px -10px rgba(0,20,50,0.35),0 10px 20px -6px rgba(0,20,50,0.2),inset 0 1px 0 rgba(255,255,255,0.35);
  animation:cardIn 0.85s cubic-bezier(0.16,1,0.3,1) both;
}
.card::before,.card::after{content:"";position:absolute;width:60px;height:60px;border:1.5px solid rgba(255,255,255,0.22);pointer-events:none}
.card::before{top:14px;left:14px;border-right:none;border-bottom:none;border-radius:10px 0 0 0}
.card::after{bottom:14px;right:14px;border-left:none;border-top:none;border-radius:0 0 10px 0}

.logo{
  width:88px;height:88px;border-radius:50%;overflow:hidden;
  background:linear-gradient(145deg,#5ba3e0,#1a7ac4);
  border:3px solid rgba(255,255,255,0.85);
  box-shadow:0 10px 24px rgba(26,122,196,0.35);
  margin-bottom:16px;animation:float 4s ease-in-out infinite;
}
.logo img{width:100%;height:100%;object-fit:cover;display:block}

.eyebrow{
  display:inline-flex;align-items:center;gap:8px;padding:6px 15px;margin-bottom:12px;border-radius:100px;
  background:rgba(255,255,255,0.22);border:1px solid rgba(255,255,255,0.35);color:#fff;
  font-size:11.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;
  text-shadow:0 1px 4px rgba(0,0,0,0.35);animation:fadeUp 0.7s 0.1s both;
}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:#7ec8ff;box-shadow:0 0 0 4px rgba(126,200,255,0.3);animation:pulse 2s infinite}

h1{
  font-family:'Playfair Display',Georgia,serif;color:#fff;font-size:clamp(28px,5.5vw,42px);
  line-height:1.18;font-weight:700;letter-spacing:-0.4px;margin-bottom:4px;
  text-shadow:0 2px 14px rgba(0,0,0,0.4);animation:fadeUp 0.7s 0.18s both;
}
.divider{
  width:min(50%,260px);height:2.5px;margin:16px auto 22px;border-radius:99px;
  background:linear-gradient(90deg,transparent,#9fd0f5 25%,#fff 50%,#9fd0f5 75%,transparent);
  animation:grow 0.9s 0.3s both;
}
.features{width:100%;display:grid;gap:11px;text-align:left}
.item{
  display:flex;align-items:center;gap:13px;padding:13px 15px;border-radius:15px;
  background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.25);
  box-shadow:0 4px 14px rgba(0,20,40,0.12);color:#fff;
  font-size:clamp(14.5px,2.7vw,16.5px);font-weight:600;line-height:1.35;
  text-shadow:0 1px 5px rgba(0,0,0,0.35);transition:transform 0.25s ease,background 0.25s ease;
  animation:slideIn 0.6s both;
}
.item:nth-child(1){animation-delay:0.32s}
.item:nth-child(2){animation-delay:0.42s}
.item:nth-child(3){animation-delay:0.52s}
.item:nth-child(4){animation-delay:0.62s}
.item:hover{transform:translateX(5px);background:rgba(255,255,255,0.26)}
.check{
  flex:0 0 40px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,0.92);border:2px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,0.15);
}
.check svg{width:20px;height:20px}

.telegram{
  width:100%;min-height:62px;margin-top:24px;padding:12px 18px;display:flex;align-items:center;justify-content:center;gap:12px;
  border-radius:15px;text-decoration:none;color:#fff;
  background:linear-gradient(135deg,#0a6eb8 0%,#1590e0 100%);
  box-shadow:0 10px 26px rgba(10,110,184,0.4),inset 0 1px 0 rgba(255,255,255,0.25);
  font-size:clamp(16px,3.1vw,19px);font-weight:700;letter-spacing:0.2px;
  transition:transform 0.25s ease,box-shadow 0.25s ease;animation:fadeUp 0.7s 0.7s both;position:relative;overflow:hidden;
}
.telegram::before{
  content:"";position:absolute;top:0;left:-100%;width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);transition:left 0.55s ease;
}
.telegram:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(10,110,184,0.5)}
.telegram:hover::before{left:120%}
.tg{width:38px;height:38px;flex:0 0 38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,0.22)}
.tg svg{width:22px;height:22px}

.bottom{
  margin-top:16px;color:rgba(255,255,255,0.9);font-size:clamp(12.5px,2vw,14.5px);font-weight:500;
  letter-spacing:0.3px;text-shadow:0 1px 5px rgba(0,0,0,0.35);animation:fade 1s 0.85s both;
}
.toast{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);
  background:linear-gradient(135deg,#0a6eb8,#1590e0);color:#fff;padding:14px 28px;border-radius:50px;
  font-weight:700;font-size:15px;box-shadow:0 10px 30px rgba(10,110,184,0.4);opacity:0;
  transition:all 0.4s cubic-bezier(0.16,1,0.3,1);z-index:100;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@keyframes cardIn{from{opacity:0;transform:translateY(28px) scale(0.97)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes grow{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:0.7;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}
@keyframes fade{from{opacity:0}to{opacity:1}}

@media(max-width:580px){
  .page{padding:14px 12px}
  .card{padding:26px 18px 22px;border-radius:20px}
  .logo{width:76px;height:76px;margin-bottom:12px}
  h1{font-size:26px}
  .item{padding:11px 12px;gap:11px;font-size:14.5px}
  .check{flex-basis:36px;width:36px;height:36px}
  .check svg{width:18px;height:18px}
  .telegram{min-height:56px;font-size:15.5px;margin-top:20px}
  .tg{width:34px;height:34px;flex-basis:34px}
  .tg svg{width:20px;height:20px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition:none!important}
}
</style>

</head>
<body>
<div class="page">
  <main class="card">
    <div class="logo">
      <img src="profile.jpg" alt="Profile logo" onerror="this.style.display='none'">
    </div>

    <div class="eyebrow"><i></i> Remote Work Opportunity</div>

    <h1>Freelancer Publication 📖</h1>
    <div class="divider"></div>

    <section class="features">
      <div class="item">
        <span class="check"><svg viewBox="0 0 40 40" fill="none"><path d="m8 21 7 7 17-18" stroke="#0b6fc4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span>Only For Females</span>
      </div>
      <div class="item">
        <span class="check"><svg viewBox="0 0 40 40" fill="none"><path d="m8 21 7 7 17-18" stroke="#0b6fc4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span>Company Will Parcel All Material<br>To Your Home</span>
      </div>
      <div class="item">
        <span class="check"><svg viewBox="0 0 40 40" fill="none"><path d="m8 21 7 7 17-18" stroke="#0b6fc4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span>Simple &amp; Easy Work</span>
      </div>
      <div class="item">
        <span class="check"><svg viewBox="0 0 40 40" fill="none"><path d="m8 21 7 7 17-18" stroke="#0b6fc4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span>Training Material Provided</span>
      </div>
    </section>

    <a class="telegram" href="https://telegram.me/+G-fjhpyGwKU2MGE1" target="_blank" rel="noopener noreferrer" onclick="trackTelegramClick(event, this.href);">
      <span class="tg">
        <svg viewBox="0 0 48 48" fill="none"><path d="M40.8 8.3 34.7 39c-.5 2.2-1.8 2.7-3.6 1.7l-10-7.4-4.8 4.6c-.5.5-.9.9-1.9.9l.7-10.1 18.4-16.6c.8-.7-.2-1.1-1.2-.4L9.6 25.8l-9.7-3c-2.1-.7-2.1-2.1.4-3L38.2 5.7c1.8-.7 3.4.4 2.6 2.6Z" fill="white"/></svg>
      </span>
      <span>Join Telegram for Details</span>
    </a>

    <div class="bottom">Remote • Flexible • Step-by-Step Training</div>
  </main>
</div>

<div class="toast" id="successToast">Click on Request to Join</div>

<script>
function trackTelegramClick(event, url) {
  event.preventDefault();
  var toast = document.getElementById('successToast');
  if (toast) {
    toast.classList.add('show');
    setTimeout(function(){ toast.classList.remove('show'); }, 2000);
  }
  if (typeof fbq === 'function') {
    try { fbq('track', 'Contact', { content_name: 'Content', content_type: 'content' }); } catch (e) {}
  }
  setTimeout(function() { window.location.href = url; }, 250);
}
</script>
</body>
</html>
